# Include this location inside the active HTTPS server block for api.upgoma.org.
# system.upgoma.org (hosted on Vercel) proxies its /api/* requests to this host.
# The Node service must be running locally on 127.0.0.1:8787.
location ^~ /api/ {
    client_max_body_size 40m;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
